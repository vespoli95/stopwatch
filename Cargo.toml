[package]
name = "stopwatch"
version = "0.1.0"
edition = "2024"
description = "A small always-on-top desktop stopwatch"
license = "MIT"
repository = "https://github.com/avespo/stopwatch"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["tls"] }

[profile.release]
strip = true
lto = true
codegen-units = 1

