[package]
name = "stopwatch"
version = "0.1.0"
edition = "2024"
description = "A small always-on-top desktop stopwatch"
license = "MIT"
repository = "https://github.com/vespoli95/stopwatch"
build = "build.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["tls"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"

[build-dependencies]
winresource = "0.1"

[profile.release]
strip = true
lto = true
codegen-units = 1

